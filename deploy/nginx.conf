# ==============================================================================
# ไฟล์: deploy/nginx.conf
# หน้าที่: การตั้งค่า Nginx Web Server และ Reverse Proxy สำหรับเซิร์ฟเวอร์คณะ/มหาลัย
# ปลายทางบน Server: /etc/nginx/sites-available/aunqa.conf
# ==============================================================================

server {
    listen 80;
    server_name aunqa.cpt.local 10.0.0.100; # เปลี่ยนเป็น IP หรือโดเมนของเซิร์ฟเวอร์คณะ

    # กำหนดขนาดไฟล์อัปโหลดสูงสุด 50MB ตามที่ระบบรองรับ (สำหรับไฟล์เอกสารและรูปภาพหลักฐาน)
    client_max_body_size 50M;

    # 1. ให้บริการไฟล์ Frontend (React + Vite Build)
    location / {
        root /var/www/aun-qa/client/dist;
        index index.html index.htm;
        # รองรับ React Router (SPA) เมื่อ Refresh หน้าเว็บไม่ให้ขึ้น 404 Not Found
        try_files $uri $uri/ /index.html;
    }

    # 2. ส่งต่อคำขอ REST API ไปยัง Node.js Backend (Port 5001)
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. ส่งต่อการเรียกดูและดาวน์โหลดไฟล์หลักฐานไปยัง Backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
